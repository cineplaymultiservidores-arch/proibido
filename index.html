<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECRETTO.YOU</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Montserrat', sans-serif; background: #000 url('https://i.imgur.com/8Qm9QZq.jpg') no-repeat center top; background-size: cover; color:#fff; text-align:center; min-height:100vh; }
.overlay { background: rgba(0,0,0,0.85); min-height:100vh; padding:20px 15px; }
.container { padding:20px 15px; max-width:420px; margin:auto; }
.logo { margin:10px 0 20px; }
.logo svg { width:60px; height:60px; }
.logo h1 { font-size:28px; font-weight:900; letter-spacing:2px; }
.logo h1 span { color:#ff0040; }
.sub { font-size:12px; color:#ff0040; letter-spacing:3px; margin-bottom:25px; }
.caixa { background: rgba(10,10,10,0.8); padding:25px; border-radius:15px; border:1px solid #ff0040; box-shadow: 0 0 30px rgba(255,0,64,0.3); margin-bottom:20px; backdrop-filter: blur(5px); }
input, select { width:100%; padding:14px; margin:8px 0; background:#111; border:1px solid #333; border-radius:8px; color:#fff; font-size:15px; text-align:center; font-weight:600; }
.btn { width:100%; padding:16px; background: linear-gradient(90deg, #ff0040, #cc0033); border:none; border-radius:10px; color:#fff; font-size:16px; font-weight:900; cursor:pointer; margin-top:10px; text-transform:uppercase; }
.btn-insta { background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%); border: none; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration:none; }
.btn-insta svg { width:20px; height:20px; fill:#fff; }
#cadastro, #formulario, #resultado { display:none; }
.app-selector { display:flex; justify-content:space-around; margin:15px 0; gap:8px; flex-wrap:wrap; }
.app-item { width:30%; padding:10px 5px; background:#111; border:2px solid #333; border-radius:10px; cursor:pointer; margin-bottom:8px; }
.app-item.active { border-color:#ff0040; background:#1a0008; }
.app-item img { width:30px; height:30px; margin-bottom:5px; }
.app-item p { font-size:9px; color:#aaa; }
.radar-box { width:200px; height:200px; margin:20px auto; position:relative; border:2px solid #ff0040; border-radius:50%; background: radial-gradient(circle, rgba(255,0,64,0.1) 0%, transparent 70%); }
.radar-line { position:absolute; top:50%; left:50%; width:2px; height:100px; background: linear-gradient(transparent, #ff0040); transform-origin: bottom center; animation: scan 2s linear infinite; }
@keyframes scan { from {transform: translateX(-50%) rotate(0deg);} to {transform: translateX(-50%) rotate(360deg);} }

/* PLAY STORE INFO */
.play-info { display:flex; justify-content:space-around; margin:20px 0; padding:15px; background:rgba(0,0,0,0.5); border-radius:10px; border:1px solid #333; }
.play-num { font-size:18px; font-weight:900; color:#ff0040; }
.stars { color:#ffb400; font-size:16px; }

/* COMENTÁRIOS */
.comentarios-box { margin:20px 0; text-align:left; }
.com-titulo { font-size:16px; font-weight:900; margin-bottom:10px; }
.com-lista { max-height:350px; overflow-y:auto; }
.com-item { display:flex; gap:10px; padding:12px; background:#0a0a0a; border-radius:10px; margin-bottom:8px; }
.com-avatar { width:35px; height:35px; border-radius:50%; background:#222; background-size:cover; }

/* CARD TINDER */
.cidade-titulo { color:#ff0040; font-size:14px; font-weight:900; margin:15px 0 10px; }
.tinder-area { position:relative; width:100%; height:420px; margin-bottom:15px; touch-action: none; }
.tinder-card { position:absolute; width:100%; height:100%; background:#111; border-radius:15px; border:2px solid #ff0040; overflow:hidden; cursor: grab; }
.tinder-card.dragging { cursor: grabbing; transition: none; }
.tinder-foto { width:100%; height:100%; background-size:cover; background-position:center; pointer-events: none; }
.tinder-info { position:absolute; bottom:0; left:0; right:0; padding:20px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); text-align:left; pointer-events: none; }
.tinder-nome { font-size:22px; font-weight:900; }
.tinder-cidade { font-size:14px; color:#00aaff; margin-top:5px; }
.tinder-contador { font-size:10px; color:#aaa; text-align:center; margin-bottom:10px; }
.tinder-btns { display:flex; gap:10px; }
.tinder-btn { flex:1; padding:14px; border-radius:10px; border:2px solid #ff0040; background:transparent; color:#ff0040; font-weight:900; font-size:14px; }
.tinder-like { position:absolute; top:20px; right:20px; color:#00ff88; font-size:40px; font-weight:900; transform: rotate(20deg); opacity:0; }
.tinder-nope { position:absolute; top:20px; left:20px; color:#ff0040; font-size:40px; font-weight:900; transform: rotate(-20deg); opacity:0; }

.card { background: rgba(10,0,10,0.9); padding:20px; border-radius:15px; border:2px solid #ff0040; }
.status-ok { color:#00ff88; font-size:18px; margin-bottom:10px; font-weight:900; }
.contador { color:#00aaff; font-size:18px; margin:10px 0; font-weight:700; }
.loading-bar { background:#111; border-radius:10px; margin:15px 0; border:1px solid #ff0040; }
.progress { height:25px; background: linear-gradient(90deg, #ff0040, #00aaff); width:0%; border-radius:10px; }
.classificacao { display:inline-block; background:#ff0040; color:#000; padding:3px 8px; border-radius:5px; font-size:10px; font-weight:900; }
.rodape { font-size:10px; color:#444; margin-top:20px; }
</style>
</head>
<body>
<div class="overlay">
<div class="container">
    <div class="logo">
        <svg viewBox="0 0 24 24"><path fill="#ff0040" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <h1>SECRETTO<span>.YOU</span></h1>
        <p class="sub"> </p>
    </div>

    <div class="play-info">
        <div><div class="stars">★★★ 4.8</div><div style="font-size:9px; color:#aaa;">1.2M Avaliações</div></div>
        <div><div class="play-num">1B+</div><div style="font-size:9px; color:#aaa;">Usuários</div></div>
        <div><div class="classificacao">+16</div><div style="font-size:9px; color:#aaa;">Classificação</div></div>
    </div>

    <div class="caixa" id="cadastro">
        <p style="color:#ff0040; font-size:20px; font-weight:900;">CRIAR PERFIL</p>
        <input type="text" id="cad_nome" placeholder="SEU PRIMEIRO NOME">
        <input type="number" id="cad_idade" placeholder="SUA IDADE" min="16" max="99">
        <button class="btn" onclick="salvarCadastro()">COMEÇAR TESTE</button>
    </div>

    <div class="caixa" id="formulario">
        <input type="text" id="nome" placeholder="NOME DA PESSOA">
        <input type="text" id="cidade" placeholder="CIDADE - Ex: Rio de Janeiro">
        <p style="margin:15px 0 5px; font-size:12px; color:#aaa;">ESCOLHA A REDE SOCIAL</p>
        <div class="app-selector">
            <div class="app-item" onclick="selecionarApp(this, 'Instagram')"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"><p>Instagram</p></div>
            <div class="app-item" onclick="selecionarApp(this, 'WhatsApp')"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png"><p>WhatsApp</p></div>
            <div class="app-item" onclick="selecionarApp(this, 'Facebook')"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"><p>Facebook</p></div>
            <div class="app-item" onclick="selecionarApp(this, 'X')"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968830.png"><p>X</p></div>
            <div class="app-item" onclick="selecionarApp(this, 'Snapchat')"><img src="https://cdn-icons-png.flaticon.com/512/733/733585.png"><p>Snapchat</p></div>
            <div class="app-item" onclick="selecionarApp(this, 'Kwai')"><img src="https://cdn-icons-png.flaticon.com/512/5968/5968705.png"><p>Kwai</p></div>
        </div>
        <select id="sexo">
            <option value="mulher">BUSCAR MULHERES</option>
            <option value="homem">BUSCAR HOMENS</option>
        </select>
        <button class="btn" onclick="detectar()">[ INICIAR BUSCA ]</button>
    </div>

    <div id="resultado"></div>

    <div class="comentarios-box" id="comentariosBox">
        <p class="com-titulo">Avaliações e comentários</p>
        <div class="com-lista" id="listaComentarios"></div>
    </div>

    <a href="https://www.instagram.com/secretto.yo?igsh=bzRpYWwwbGo2cDRl&utm_source=qr" target="_blank" class="btn btn-insta">
        <svg viewBox="0 0 24 24"><path d="M7.8 2h8.4C19.4 2 22 4.6 22 9.2v5.6c0 4.6-2.6 7.2-6.8 7.2H7.8C4.6 22 2 19.4 2 14.8V9.2C2 4.6 4.6 2 7.8 2m-.2 2A3.6 3.6 0 0 0 4 7.6v8.8C4 20.39 5.61 22 7.6 22h8.8a3.6 3.6 0 0 0 3.6-3.6V7.6C20 5.61 18.39 4 16.4 4H7.6m9.65 1.5a1.25 1.25 0 0 1 1.25 1.25A1.25 1.25 0 0 1 17.25 8 1.25 1.25 0 0 1 16 6.75a1.25 1.25 0 0 1 1.25-1.25M12 7a5 5 0 0 1 5 5 5 5 0 0 1-5 5 5 5 0 0 1-5-5 5 5 0 0 1 5-5m0 2a3 3 0 0 0-3 3 3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3z"/></svg>
        NOSSO INSTAGRAM
    </a>
    <p class="rodape">SECRETTO.YOU v4.0</p>
</div>
</div>

<script>
let appSelecionado = '';
let cidadeAlvo = '';
let perfilAtual = 0;
let perfis = [];
let isDragging = false;
let startX = 0;
let currentX = 0;

const nomesReais = ["Mariana Silva","Pedro Santos","Julia Costa","Lucas Oliveira","Amanda Rocha","Rafael Lima","Beatriz Almeida","Gustavo Pereira","Camila Souza","Felipe Rodrigues"];
const comentariosReais = [
    "App muito divertido pra conhecer gente nova!", "Interface muito boa e fácil de usar", "Achei várias pessoas da minha cidade",
    "Em 5 minutos já tinha 3 matches", "App mais preciso que já usei", "Suporte respondeu super rápido",
    "Vale a pena testar", "Anônimo e seguro, adorei", "Melhor que os outros apps do tipo", "Resultados em tempo real, muito top"
];

function gerarComentarios(){
    let lista = document.getElementById('listaComentarios');
    for(let i=0; i<100; i++){
        let nome = nomesReais[Math.floor(Math.random()*nomesReais.length)];
        let msg = comentariosReais[Math.floor(Math.random()*comentariosReais.length)];
        let img = Math.floor(Math.random()*70);
        lista.innerHTML += `<div class="com-item"><div class="com-avatar" style="background-image:url(https://i.pravatar.cc/50?img=${img})"></div><div><div style="font-size:12px; font-weight:700; color:#ff0040;">${nome}</div><div style="font-size:10px; color:#ffb400;">★★★</div><div style="font-size:11px; color:#aaa;">${msg}</div></div></div>`;
    }
}

function selecionarApp(el, app){
    document.querySelectorAll('.app-item').forEach(i=>i.classList.remove('active'));
    el.classList.add('active');
    appSelecionado = app;
}

function salvarCadastro(){
    let nome = document.getElementById('cad_nome').value;
    if(nome.length < 2){ alert('Preencha seu nome'); return; }
    localStorage.setItem('secretto_user', nome);
    document.getElementById('cadastro').style.display='none';
    document.getElementById('formulario').style.display='block';
}

function detectar(){
    if(!appSelecionado){ alert('Selecione uma rede social'); return; }
    cidadeAlvo = document.getElementById('cidade').value || 'Sua Cidade';
    gerarPerfis();
    document.getElementById('formulario').style.display='none';
    document.getElementById('comentariosBox').style.display='none';
    document.getElementById('resultado').style.display='block';
    document.getElementById('resultado').innerHTML = `
    <div class="caixa">
        <p style="color:#00aaff; font-size:12px; font-weight:700;">BUSCANDO EM ${appSelecionado} - ${cidadeAlvo}...</p>
        <div class="radar-box"><div class="radar-line"></div></div>
        <div class="loading-bar"><div class="progress" id="progress"></div></div>
        <button class="btn" onclick="mostrarResultado()">VER RESULTADO</button>
    </div>`;
    simularProgresso();
}

function simularProgresso(){
    let p = 0; let el = document.getElementById('progress');
    let i = setInterval(()=>{ p+=5; el.style.width=p+'%'; if(p>=100) clearInterval(i); }, 120);
}

function gerarPerfis(){
    let sexo = document.getElementById('sexo').value;
    perfis = [];
    for(let i=0; i<5; i++){
        if(sexo === 'mulher'){
            perfis.push({
                nome: nomesReais[Math.floor(Math.random() * 10)],
                idade: Math.floor(Math.random() * 12) + 18,
                foto: Math.floor(Math.random()*35) + 1
            });
        } else {
            perfis.push({
                nome: nomesReais[Math.floor(Math.random() * 10)],
                idade: Math.floor(Math.random() * 12) + 18,
                foto: Math.floor(Math.random()*35) + 36
            });
        }
    }
}

function mostrarResultado(){
    perfilAtual = 0;
    document.getElementById('resultado').innerHTML = `
    <div class="card">
        <p class="status-ok">✅ PERFIS ENCONTRADOS EM ${cidadeAlvo.toUpperCase()}</p>
        <p class="contador">${Math.floor(Math.random() * 200) + 50} Pessoas compatíveis no ${appSelecionado}</p>
        <p class="cidade-titulo">${Math.floor(Math.random() * 50) + 20} PESSOAS DE ${cidadeAlvo.toUpperCase()} USARAM O APP</p>
        <div class="tinder-contador" id="contador">Perfil 1 de 5</div>
        <div class="tinder-area" id="tinderArea"></div>
        <div class="tinder-btns">
            <button class="tinder-btn" onclick="swipeCard('left')">❌ PASSAR</button>
            <button class="tinder-btn" style="background:#ff0040; color:#fff;" onclick="swipeCard('right')">✅ CURTIR</button>
        </div>
        <button class="btn" style="margin-top:15px;" onclick="alert('Conectando...')">VER PERFIL COMPLETO</button>
    </div>`;
    mostrarPerfil();
    adicionarEventosDrag();
}

function mostrarPerfil(){
    let p = perfis[perfilAtual];
    document.getElementById('tinderArea').innerHTML = `
    <div class="tinder-card" id="cardAtual">
        <div class="tinder-like">LIKE</div>
        <div class="tinder-nope">NOPE</div>
        <div class="tinder-foto" style="background-image:url(https://i.pravatar.cc/400?img=${p.foto})"></div>
        <div class="tinder-info">
            <div class="tinder-nome">${p.nome}, ${p.idade}</div>
            <div class="tinder-cidade">📍 ${cidadeAlvo}</div>
        </div>
    </div>`;
    document.getElementById('contador').innerText = `Perfil ${perfilAtual + 1} de 5`;
}

function adicionarEventosDrag(){
    let card = document.getElementById('cardAtual');
    card.addEventListener('mousedown', dragStart);
    card.addEventListener('mousemove', dragging);
    card.addEventListener('mouseup', dragEnd);
    card.addEventListener('touchstart', dragStart);
    card.addEventListener('touchmove', dragging);
    card.addEventListener('touchend', dragEnd);
}

function dragStart(e){
    isDragging = true;
    startX = e.type.includes('mouse')? e.pageX : e.touches[0].pageX;
    document.getElementById('cardAtual').classList.add('dragging');
}

function dragging(e){
    if(!isDragging) return;
    currentX = e.type.includes('mouse')? e.pageX : e.touches[0].pageX;
    let diff = currentX - startX;
    let card = document.getElementById('cardAtual');
    card.style.transform = `translateX(${diff}px) rotate(${diff/20}deg)`;
    if(diff > 50) document.querySelector('.tinder-like').style.opacity = 1;
    else document.querySelector('.tinder-like').style.opacity = 0;
    if(diff < -50) document.querySelector('.tinder-nope').style.opacity = 1;
    else document.querySelector('.tinder-nope').style.opacity = 0;
}

function dragEnd(e){
    if(!isDragging) return;
    isDragging = false;
    let diff = currentX - startX;
    let card = document.getElementById('cardAtual');
    card.classList.remove('dragging');
    if(diff > 100) swipeCard('right');
    else if(diff < -100) swipeCard('left');
    else {
        card.style.transform = 'translateX(0) rotate(0)';
        document.querySelector('.tinder-like').style.opacity = 0;
        document.querySelector('.tinder-nope').style.opacity = 0;
    }
}

function swipeCard(dir){
    let card = document.getElementById('cardAtual');
    card.style.transition = 'transform 0.3s';
    card.style.transform = dir === 'right'? 'translateX(500px) rotate(30deg)' : 'translateX(-500px) rotate(-30deg)';
    setTimeout(()=>{
        perfilAtual++;
        if(perfilAtual >= perfis.length){
            perfilAtual = 0;
            alert('Você viu todos os perfis!');
        }
        mostrarPerfil();
        adicionarEventosDrag();
    }, 300);
}

window.onload = () => {
    gerarComentarios();
    if(localStorage.getItem('secretto_user')){ document.getElementById('formulario').style.display='block'; }
    else{ document.getElementById('cadastro').style.display='block'; }
}
</script>
</body>
</html>
