<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECRETTO.YOU</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Montserrat', sans-serif; background: #000; color:#fff; text-align:center; min-height:100vh; }
.overlay { background: rgba(0,0,0,0.85); min-height:100vh; padding:20px 15px; }
.container { padding:20px 15px; max-width:420px; margin:auto; }
.logo h1 { font-size:28px; font-weight:900; letter-spacing:2px; }
.logo h1 span { color:#ff0040; }
.sub { font-size:12px; color:#ff0040; letter-spacing:3px; margin-bottom:15px; }
.caixa { background: rgba(10,10,10,0.8); padding:25px; border-radius:15px; border:1px solid #ff0040; margin-bottom:20px; }
input, select { width:100%; padding:14px; margin:8px 0; background:#111; border:1px solid #333; border-radius:8px; color:#fff; font-size:15px; text-align:center; font-weight:600; }
.btn { width:100%; padding:16px; background: linear-gradient(90deg, #ff0040, #cc0033); border:none; border-radius:10px; color:#fff; font-size:16px; font-weight:900; cursor:pointer; margin-top:10px; }
.btn-secundario { background: transparent; border:2px solid #ff0040; color:#ff0040; }
#cadastro, #formulario, #resultado { display:none; }

/* SEU GRID ORIGINAL */
.grid-perfis { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:15px 0; }
.card-perfil { background:#111; border-radius:12px; border:1px solid #333; overflow:hidden; }
.card-foto { width:100%; height:140px; background-size:cover; background-position:center; filter: blur(6px); }

/* RODAPÉ NOVO IGUAL TINDER */
.card-info { padding:10px; text-align:left; background:#0a0a0a; }
.card-nome { font-size:15px; font-weight:900; }
.card-idade { font-size:14px; color:#ccc; font-weight:600; }
.card-cidade { font-size:12px; color:#00aaff; margin-top:3px; }

.fidelidade-box { background: linear-gradient(135deg, #00ff88, #00aaff); padding:20px; border-radius:15px; margin:15px 0; }
.fidelidade-percent { font-size:48px; font-weight:900; color:#000; }
.fidelidade-selo { background:#000; color:#00ff88; padding:8px 12px; border-radius:8px; font-size:13px; font-weight:900; display:inline-block; margin-top:10px; }

.loading-bar { background:#111; border-radius:10px; margin:15px 0; border:1px solid #ff0040; }
.progress { height:25px; background: linear-gradient(90deg, #ff0040, #00aaff); width:0%; border-radius:10px; }
</style>
</head>
<body>
<div class="overlay">
<div class="container">
    <div class="logo"><h1>SECRETTO<span>.YOU</span></h1><p class="sub">TESTE DE COMPATIBILIDADE</p></div>

    <div class="caixa" id="cadastro">
        <p style="color:#ff0040; font-size:20px; font-weight:900;">CRIAR PERFIL</p>
        <input type="text" id="cad_nome" placeholder="SEU PRIMEIRO NOME">
        <input type="number" id="cad_idade" placeholder="SUA IDADE" min="16" max="99">
        <button class="btn" onclick="salvarCadastro()">COMEÇAR BUSCA 🔎</button>
    </div>

    <div class="caixa" id="formulario">
        <input type="text" id="nome" placeholder="NOME DA PESSOA">
        <input type="number" id="idade" placeholder="IDADE BASE - Ex: 22" min="16" max="99">
        <input type="text" id="cidade" placeholder="CIDADE - Ex: Rio de Janeiro">
        <select id="app">
            <option value="">SELECIONE O APP</option>
            <option value="Tinder">Tinder</option>
            <option value="Instagram">Instagram</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Facebook">Facebook</option>
        </select>
        <select id="sexo">
            <option value="mulher">BUSCAR MULHERES</option>
            <option value="homem">BUSCAR HOMENS</option>
        </select>
        <button class="btn" onclick="detectar()">[ INICIAR BUSCA ]</button>
    </div>

    <div id="resultado"></div>
</div>
</div>

<script>
let cidadeAlvo = '';
let perfis = [];
let nomeBuscado = '';

const nomesHomem = ["Pedro","Lucas","Rafael","Gustavo","Felipe","Bruno","Matheus","Gabriel","Daniel","Thiago"];
const nomesMulher = ["Mariana","Julia","Amanda","Beatriz","Camila","Larissa","Fernanda","Juliana","Patricia","Aline"];

function salvarCadastro(){
    let nome = document.getElementById('cad_nome').value;
    if(nome.length < 2){ alert('Preencha seu nome'); return; }
    localStorage.setItem('secretto_user', nome);
    document.getElementById('cadastro').style.display='none';
    document.getElementById('formulario').style.display='block';
}

function detectar(){
    let app = document.getElementById('app').value;
    nomeBuscado = document.getElementById('nome').value || 'Pessoa';
    if(app === ''){ alert('Selecione uma rede social'); return; }
    cidadeAlvo = document.getElementById('cidade').value || 'Sua Cidade';
    gerarPerfis();
    document.getElementById('formulario').style.display='none';
    document.getElementById('resultado').style.display='block';
    document.getElementById('resultado').innerHTML = `
    <div class="caixa">
        <p style="color:#00aaff; font-size:12px;">ANALISANDO ${nomeBuscado.toUpperCase()} EM ${app}...</p>
        <div class="loading-bar"><div class="progress" id="progress"></div></div>
        <button class="btn" onclick="mostrarResultado()">VER PERFIS</button>
    </div>`;
    simularProgresso();
}

function simularProgresso(){
    let p = 0; let el = document.getElementById('progress');
    let i = setInterval(()=>{ p+=5; el.style.width=p+'%'; if(p>=100) clearInterval(i); }, 120);
}

function gerarPerfis(){
    let sexo = document.getElementById('sexo').value;
    let idadeBase = parseInt(document.getElementById('idade').value) || 22;
    perfis = [];
    for(let i=0; i<6; i++){
        // AQUI A IDADE VARIA: +/- 4 anos
        let idadeVariada = idadeBase + Math.floor(Math.random() * 9) - 4;
        if(idadeVariada < 16) idadeVariada = 16;
        
        if(sexo === 'mulher'){
            perfis.push({
                nome: nomesMulher[Math.floor(Math.random() * nomesMulher.length)],
                idade: idadeVariada,
                foto: Math.floor(Math.random()*35) + 1
            });
        } else {
            perfis.push({
                nome: nomesHomem[Math.floor(Math.random() * nomesHomem.length)],
                idade: idadeVariada,
                foto: Math.floor(Math.random()*35) + 36
            });
        }
    }
}

function mostrarResultado(){
    let htmlPerfis = '';
    perfis.forEach(p => {
        htmlPerfis += `
        <div class="card-perfil">
            <div class="card-foto" style="background-image:url(https://i.pravatar.cc/300?img=${p.foto})"></div>
            <div class="card-info">
                <div class="card-nome">${p.nome}, <span class="card-idade">${p.idade}</span></div>
                <div class="card-cidade">📍 ${cidadeAlvo}</div>
            </div>
        </div>`;
    });

    document.getElementById('resultado').innerHTML = `
    <div class="fidelidade-box">
        <div style="font-size:14px; color:#000;">ÍNDICE DE FIDELIDADE</div>
        <div class="fidelidade-percent">0%</div>
        <div style="font-size:12px; color:#000;">CHANCE DE TRAIÇÃO</div>
        <div class="fidelidade-selo">✓ PESSOA 100% CONFIÁVEL</div>
    </div>
    <div class="grid-perfis">${htmlPerfis}</div>
    <button class="btn btn-secundario" onclick="novaConsulta()">🔄 NOVA CONSULTA</button>`;
}

function novaConsulta(){
    document.getElementById('resultado').style.display='none';
    document.getElementById('formulario').style.display='block';
}

window.onload = () => {
    if(localStorage.getItem('secretto_user')){ document.getElementById('formulario').style.display='block'; }
    else{ document.getElementById('cadastro').style.display='block'; }
}
</script>
</body>
</html>
