<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detector de Traição</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Arial Black', Arial; background:#000; color:#fff; text-align:center; transition: background 0.3s; }
body.piscar { background: #330000; }
.container { padding:40px 20px; max-width:650px; margin:auto; }
h1 { font-size:35px; color:#ff0033; text-shadow: 0 0 10px red; margin-bottom:10px; }
.caixa { background:#0d0d0d; padding:25px; border-radius:20px; border:2px solid #ff0033; margin-top:20px; box-shadow: 0 0 20px rgba(255,0,51,0.3); }
input, select { width:100%; padding:16px; margin:10px 0; background:#000; border:2px solid #333; border-radius:12px; color:#fff; font-size:16px; text-align:center; }
.btn { width:100%; padding:18px; background: linear-gradient(90deg, #ff0033, #ff0044); border:none; border-radius:12px; color:#fff; font-size:20px; font-weight:bold; cursor:pointer; margin-top:10px; }
.btn:active { transform: scale(0.97); }
.btn-reset { background: linear-gradient(90deg, #333, #555); font-size:16px; }
.btn-gps { background: linear-gradient(90deg, #00ff88, #00cc66); font-size:14px; padding:12px; }
#resultado { margin-top:25px; display:none; }
.avatar { width:90px; height:90px; border-radius:50%; background-size:cover; background-position:center; border:3px solid #fff; display:inline-block; margin:6px; }
.borrado { filter: blur(22px); border-color:red; box-shadow: 0 0 20px rgba(255,0,0,0.8); }
.card { background:#110000; padding:20px; border-radius:15px; border:2px solid #ff0033; animation: aparecer 0.5s; }
@keyframes aparecer { from {opacity:0; transform:scale(0.9);} to {opacity:1; transform:scale(1);} }
.status-traida { color:red; font-size:20px; margin-bottom:10px; }
.status-nao { color:#00ff88; font-size:26px; }
.contador { font-size:60px; color:red; font-weight:bold; }
.contador-conversas { color:#ffaa00; font-size:28px; margin:10px 0; }
.avatars-box { margin:15px 0; display:flex; flex-wrap:wrap; justify-content:center; }
#mapa { height:200px; border-radius:15px; margin-top:15px; border:2px solid #ff0033; display:none; }
.rodape { font-size:9px; color:#333; margin-top:30px; }
.loading { color:#00ff88; font-size:12px; }
</style>
</head>
<body>
<div class="container">
    <h1>DETECTOR DE TRAIÇÃO</h1>

    <div class="caixa" id="formulario">
        <input type="text" id="nome" placeholder="NOME DA PESSOA">
        <div style="position:relative;">
            <input type="text" id="cidade" placeholder="CIDADE">
            <button class="btn btn-gps" onclick="pegarLocalizacao()">📍 USAR MINHA LOCALIZAÇÃO</button>
            <p id="loading" class="loading" style="display:none;">Buscando localização...</p>
        </div>
        <input type="text" id="app" placeholder="APP: Tinder, Instagram...">
        <select id="sexo">
            <option value="mulher">TESTAR MULHER</option>
            <option value="homem">TESTAR HOMEM</option>
        </select>
        <button class="btn" onclick="detectar()">ANALISAR AGORA</button>
    </div>

    <div id="resultado"></div>

    <p class="rodape"> </p>
</div>

<audio id="somAlerta" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_d1716fce92.mp3" type="audio/mpeg">
</audio>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const nomesHomem = ["Carlos Silva", "Pedro Santos", "Lucas Oliveira", "Rafael Costa", "Bruno Almeida", "Matheus Lima", "Gabriel Souza", "Diego Rocha", "Thiago Martins"];
const nomesMulher = ["Ana Souza", "Julia Costa", "Beatriz Lima", "Camila Rocha", "Mariana Alves", "Larissa Gomes", "Amanda Silva", "Fernanda Dias", "Patricia Ribeiro"];

var mapa;
var marcador;

// INICIA O MAPA
function iniciarMapa(lat, lon, cidade){
    document.getElementById("mapa").style.display = "block";

    if(mapa) mapa.remove();

    mapa = L.map('mapa').setView([lat, lon], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: ''
    }).addTo(mapa);

    // PONTO VERMELHO
    marcador = L.circleMarker([lat, lon], {
        color: 'red',
        fillColor: '#ff0033',
        fillOpacity: 0.8,
        radius: 10
    }).addTo(mapa);

    marcador.bindPopup(`<b>${cidade}</b>`).openPopup();
}

// PUXA CIDADE PELO GPS
function pegarLocalizacao(){
    var loading = document.getElementById("loading");
    loading.style.display = "block";

    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(position){
            var lat = position.coords.latitude;
            var lon = position.coords.longitude;

            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
           .then(res => res.json())
           .then(data => {
                var cidade = data.address.city || data.address.town || data.address.village || data.address.state;
                document.getElementById("cidade").value = cidade.toUpperCase();
                iniciarMapa(lat, lon, cidade.toUpperCase());
                loading.style.display = "none";
            })
           .catch(() => {
                alert("Não consegui pegar a cidade. Digita manual.");
                loading.style.display = "none";
            });
        }, function(){
            alert("Permite o acesso a localização aí");
            loading.style.display = "none";
        });
    } else {
        alert("Seu navegador não suporta GPS");
        loading.style.display = "none";
    }
}

function resetar(){
    document.getElementById("resultado").style.display = "none";
    document.getElementById("formulario").style.display = "block";
    document.getElementById("nome").value = "";
    document.getElementById("cidade").value = "";
    document.getElementById("app").value = "";
    document.getElementById("mapa").style.display = "none";
    document.body.classList.remove("piscar");
}

function gerarPessoas(quantidade, sexoOposto){
    let html = '';
    let listaNomes = sexoOposto == "homem"? nomesHomem : nomesMulher;
    let nomesUsados = [];

    for(let i = 0; i < quantidade; i++){
        let nome;
        do {
            nome = listaNomes[Math.floor(Math.random()*listaNomes.length)];
        } while(nomesUsados.includes(nome) && nomesUsados.length < listaNomes.length);
        nomesUsados.push(nome);

        let idade = Math.floor(Math.random() * 15) + 20;
        let avatarId = sexoOposto == "homem"? Math.floor(Math.random()*35) + 1 : Math.floor(Math.random()*35) + 36;
        let avatar = "https://i.pravatar.cc/300?img=" + avatarId;

        html += `
        <div style="display:inline-block; margin:8px; text-align:center;">
            <div class="avatar borrado" style="background-image:url(${avatar})"></div>
            <p style="font-size:12px; margin-top:4px;">${nome.split(' ')[0]}</p>
            <p style="font-size:10px; color:#999;">${idade} ANOS</p>
        </div>`;
    }
    return html;
}

function detectar(){
    var nomeDigitado = document.getElementById("nome").value.toUpperCase();
    var cidadeDigitada = document.getElementById("cidade").value.toUpperCase();
    var app = document.getElementById("app").value || "APPS DE NAMORO";
    var sexo = document.getElementById("sexo").value;
    var res = document.getElementById("resultado");
    var form = document.getElementById("formulario");
    var som = document.getElementById("somAlerta");
    var body = document.body;

    if(nomeDigitado == "" || cidadeDigitada == ""){
        alert("DIGITA O NOME E A CIDADE");
        return;
    }

    form.style.display = "none";
    res.style.display = "block";
    res.innerHTML = `<div class="contador" id="count">3</div>`;

    let i = 3;
    let cont = setInterval(() => {
        i--;
        document.getElementById("count").innerHTML = i > 0? i : "ANALISANDO...";
        if(i == 0) clearInterval(cont);
    }, 1000);

    setTimeout(function(){
        var traida = Math.random() > 0.5;

        if(traida){
            var quantidade = Math.floor(Math.random() * 6) + 1;
            var conversas = Math.floor(Math.random() * 75) + 15;
            var sexoAmante = sexo == "homem"? "mulher" : "homem";
            var pessoasHtml = gerarPessoas(quantidade, sexoAmante);

            som.currentTime = 0;
            som.play().catch(()=>{});
            body.classList.add("piscar");
            setTimeout(()=> body.classList.remove("piscar"), 1000);

            res.innerHTML = `
            <div class="card">
                <p class="status-traida">🚨 ${nomeDigitado} ESTÁ TE TRAINDO COM ${quantidade} PESSOA${quantidade > 1? 'S' : ''}! 🚨</p>
                <p class="contador-conversas">📱 ${conversas} CONVERSAS ENCONTRADAS</p>
                <div class="avatars-box">${pessoasHtml}</div>
                <p style="margin-top:10px;">📍 ${cidadeDigitada} - Ativo no: ${app.toUpperCase()}</p>
                <div id="mapa"></div>
                <button class="btn btn-reset" onclick="resetar()">TESTAR NOVAMENTE</button>
            </div>`;

            // Busca coordenadas da cidade digitada e mostra no mapa
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${cidadeDigitada}`)
           .then(res => res.json())
           .then(data => {
                if(data[0]){
                    iniciarMapa(parseFloat(data[0].lat), parseFloat(data[0].lon), cidadeDigitada);
                }
            });

        } else {
            res.innerHTML = `
            <div class="card">
                <p class="status-nao">✅ ${nomeDigitado} É FIEL ✅</p>
                <p>Sem atividade suspeita em ${app.toUpperCase()}</p>
                <button class="btn btn-reset" onclick="resetar()">TESTAR NOVAMENTE</button>
            </div>`;
        }
    }, 4000);
}
</script>
</body>
</html>
