<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SECRETTO YOU</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Rajdhani', sans-serif; background: #000; color:#fff; text-align:center; }
body.piscar { background: #1a001a; animation: glitch 0.3s; }
@keyframes glitch { 0%{transform:translate(0)} 20%{transform:translate(-2px,2px)} 40%{transform:translate(2px,-2px)} 60%{transform:translate(-2px)} 80%{transform:translate(2px)} 100%{transform:translate(0)} }
.container { padding:20px 15px; max-width:450px; margin:auto; }
h1 { font-family: 'Orbitron', sans-serif; font-size:26px; color:#ff00ff; text-shadow: 0 0 20px #ff00ff; margin-bottom:5px; }
.sub { font-size:12px; color:#aa00aa; margin-bottom:20px; }
.caixa { background: #0a0a0a; padding:20px; border-radius:10px; border:1px solid #ff00ff; box-shadow: 0 0 30px rgba(255,0,255,0.4); margin-bottom:20px; }
input, select { width:100%; padding:14px; margin:8px 0; background:#050505; border:1px solid #ff00ff; border-radius:5px; color:#ff00ff; font-size:16px; text-align:center; font-weight:700; }
.btn { width:100%; padding:16px; background: linear-gradient(90deg, #ff00ff, #aa00aa); border:none; border-radius:5px; color:#fff; font-size:18px; font-weight:900; cursor:pointer; margin-top:10px; font-family: 'Orbitron'; }
.btn-gps { background: linear-gradient(90deg, #00ffff, #00aaaa); color:#000; }
#cadastro, #formulario, #resultado { display:none; }
.carousel { position:relative; width:100%; max-width:350px; margin:15px auto; }
.carousel-container { overflow:hidden; border-radius:10px; border:2px solid #ff00ff; background:#000; touch-action: pan-y; }
.carousel-track { display:flex; transition: transform 0.3s ease-out; }
.carousel-item { min-width:100%; background:#050505; padding:20px; }
.avatar { width:140px; height:140px; border-radius:10px; background-size:cover; background-position:center; border:2px solid #ff00ff; margin:0 auto 10px; }
.borrado { filter: blur(20px); }
.card { background: #0a000a; padding:20px; border-radius:10px; border:2px solid #ff00ff; }
.status-traida { color:#ff00ff; font-size:18px; font-family: 'Orbitron'; }
.status-nao { color:#00ffff; font-size:22px; font-family: 'Orbitron'; }
.contador-conversas { color:#00ffff; font-size:20px; margin:10px 0; font-weight:700; }
#mapa { height:220px; border-radius:10px; margin-top:15px; border:2px solid #ff00ff; display:none; }
.loading-bar { background:#111; border-radius:5px; margin:15px 0; border:1px solid #ff00ff; }
.progress { height:25px; background: linear-gradient(90deg, #ff00ff, #00ffff); width:0%; }
.scan-text { color:#00ffff; font-size:12px; font-family: 'Orbitron'; }
.info-box { background:#0a0a0a; border:1px solid #330033; border-radius:10px; padding:20px; margin-top:20px; text-align:left; }
.info-title { color:#ff00ff; font-size:18px; font-family:'Orbitron'; margin-bottom:15px; text-align:center; }
.etapa { display:flex; align-items:flex-start; margin:15px 0; font-size:14px; }
.etapa-num { background:linear-gradient(135deg, #ff00ff, #aa00aa); color:#000; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; margin-right:12px; }
</style>
</head>
<body>
<div class="container">
    <h1>SECRETTO YOU</h1>
    <p class="sub">SISTEMA DE INTELIGÊNCIA</p>

    <div class="caixa" id="cadastro">
        <p style="color:#ff00ff; font-size:20px; font-weight:900;">ACESSO RESTRITO</p>
        <input type="text" id="cad_nome" placeholder=">> SEU PRIMEIRO NOME">
        <input type="number" id="cad_idade" placeholder=">> SUA IDADE" min="18" max="99">
        <input type="tel" id="cad_tel" placeholder=">> SEU WHATSAPP COM DDD">
        <button class="btn" onclick="salvarCadastro()">ATIVAR ACESSO</button>
    </div>

    <div class="caixa" id="formulario">
        <input type="text" id="nome" placeholder=">> NOME DO ALVO">
        <input type="text" id="cidade" placeholder=">> LOCALIZAÇÃO">
        <button class="btn btn-gps" onclick="pegarLocalizacao()">📡 RASTREAR GPS</button>
        <input type="text" id="app" placeholder=">> REDE SOCIAL ALVO">
        <select id="sexo">
            <option value="mulher">ANALISAR MULHER</option>
            <option value="homem">ANALISAR HOMEM</option>
        </select>
        <button class="btn" onclick="detectar()">[ INICIAR ANÁLISE ]</button>
    </div>

    <div id="resultado"></div>

    <div class="info-box">
        <p class="info-title">>> PROTOCOLO DE USO <<</p>
        <div class="etapa"><div class="etapa-num">1</div><div>Ative seu acesso</div></div>
        <div class="etapa"><div class="etapa-num">2</div><div>Insira os dados do alvo</div></div>
        <div class="etapa"><div class="etapa-num">3</div><div>Inicie a Análise</div></div>
    </div>
</div>

<audio id="somAlerta" src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_d1716fce92.mp3"></audio>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.onload = function(){
    if(localStorage.getItem("secretto_user")){ document.getElementById("formulario").style.display = "block"; }
    else { document.getElementById("cadastro").style.display = "block"; }
}

function salvarCadastro(){
    var nome = document.getElementById("cad_nome").value.trim();
    if(nome == ""){ alert("DIGITE SEU NOME"); return; }
    localStorage.setItem("secretto_user", "ok");
    document.getElementById("cadastro").style.display = "none";
    document.getElementById("formulario").style.display = "block";
}

const nomesHomem = ["Carlos", "Pedro", "Lucas", "Rafael", "Bruno"];
const nomesMulher = ["Ana", "Julia", "Beatriz", "Camila", "Mariana"];
var mapa; var currentSlide = 0; var totalSlides = 0;

function iniciarMapa(lat, lon, cidade){
    document.getElementById("mapa").style.display = "block";
    if(mapa) mapa.remove();
    mapa = L.map('mapa').setView([lat, lon], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapa);
    L.circleMarker([lat, lon], {color: '#ff0000', fillColor: '#ff0000', fillOpacity: 1, radius: 15}).addTo(mapa).openPopup();
}
function pegarLocalizacao(){
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(position){
            var lat = position.coords.latitude; var lon = position.coords.longitude;
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`).then(res => res.json()).then(data => {
                var cidade = data.address.city || data.address.state;
                document.getElementById("cidade").value = cidade.toUpperCase();
                iniciarMapa(lat, lon, cidade.toUpperCase());
            });
        });
    }
}
function resetar(){ location.reload(); }

function criarCarousel(quantidade, sexoOposto){
    totalSlides = quantidade; let items = '';
    let listaNomes = sexoOposto == "homem"? nomesHomem : nomesMulher;
    for(let i = 0; i < quantidade; i++){
        let nome = listaNomes[Math.floor(Math.random()*listaNomes.length)];
        let idade = Math.floor(Math.random() * 15) + 20;
        let avatarId = sexoOposto == "homem"? Math.floor(Math.random()*35) + 1 : Math.floor(Math.random()*35) + 36;
        let avatar = "https://i.pravatar.cc/300?img=" + avatarId;
        items += `<div class="carousel-item"><p>${i+1}/${quantidade}</p><div class="avatar borrado" style="background-image:url(${avatar})"></div><p style="font-size:22px; color:#ff00ff;">${nome}</p><p>${idade} ANOS</p></div>`;
    }
    return `<div class="carousel"><div class="carousel-container"><div class="carousel-track" id="track">${items}</div></div></div>`;
}

function barraCarregamento(callback){
    let progress = document.getElementById("progress");
    let width = 0;
    let intervalo = setInterval(() => {
        width += 3;
        progress.style.width = width + "%";
        if(width >= 100){ clearInterval(intervalo); callback(); }
    }, 50);
}

function detectar(){
    var nomeDigitado = document.getElementById("nome").value.toUpperCase();
    var cidadeDigitada = document.getElementById("cidade").value.toUpperCase();
    var sexo = document.getElementById("sexo").value;
    var res = document.getElementById("resultado");
    var form = document.getElementById("formulario");
    var som = document.getElementById("somAlerta");
    var body = document.body;

    if(nomeDigitado == "" || cidadeDigitada == ""){ alert("PREENCHA TODOS OS CAMPOS"); return; }

    form.style.display = "none";
    res.style.display = "block";
    res.innerHTML = `<div class="loading-bar"><div class="progress" id="progress"></div></div><p class="scan-text">INVADINDO SERVIDORES...</p>`;

    barraCarregamento(() => {
        setTimeout(function(){
            // LOGICA NOVA: 70% DE CHANCE DE TRAIR
            // SE FOR MULHER A CHANCE SOBE PRA 85%
            var chanceTrair = sexo == "mulher"? 0.85 : 0.70;
            var traida = Math.random() < chanceTrair;

            if(traida){
                var quantidade = Math.floor(Math.random() * 5) + 2; // 2 a 6 pessoas
                var conversas = Math.floor(Math.random() * 60) + 20;
                var sexoAmante = sexo == "homem"? "mulher" : "homem";
                currentSlide = 0;
                som.play().catch(()=>{});
                body.classList.add("piscar");
                setTimeout(()=> body.classList.remove("piscar"), 500);

                res.innerHTML = `<div class="card"><p class="status-traida">⚠ ALERTA SECRETTO: ${nomeDigitado} TRAIU ⚠</p><p class="contador-conversas">${quantidade} CONTATOS + ${conversas} MENSAGENS</p>${criarCarousel(quantidade, sexoAmante)}<p>LOCAL: ${cidadeDigitada}</p><div id="mapa"></div><button class="btn" onclick="resetar()">NOVA ANÁLISE</button></div>`;

                fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${cidadeDigitada}`).then(res => res.json()).then(data => { if(data[0]){ iniciarMapa(parseFloat(data[0].lat), parseFloat(data[0].lon), cidadeDigitada); } });
            } else {
                res.innerHTML = `<div class="card"><p class="status-nao">✓ ALVO SEGURO ✓</p><p>NENHUMA ATIVIDADE SECRETTO ENCONTRADA</p><button class="btn" onclick="resetar()">NOVA ANÁLISE</button></div>`;
            }
        }, 500);
    });
}
</script>
</body>
</html>
